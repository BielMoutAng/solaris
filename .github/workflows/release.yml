name: Publicar executaveis

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Solaris_Guerra_Solar_Export_Codex/solariss_codex_export/biblioteca-personagens

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Solaris_Guerra_Solar_Export_Codex/solariss_codex_export/biblioteca-personagens/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar instalador e versao portatil
        run: npm run dist

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Solaris_Guerra_Solar_Export_Codex/solariss_codex_export/biblioteca-personagens/dist/*.exe
